# What runs on every push, so that the test suite means something.
#
# The fourth audit found the whole quality apparatus these audits built -- the
# contract tests, the mutation-proven detectors, the UI suite that exists
# because a broken screen once shipped -- protected nothing automatically.
# Cloudflare Workers Builds watches `main` and runs `npm run build`. It does not
# run the tests. Merging to main IS the deploy, so a commit that broke fifty
# tests but still compiled went straight to production, and the first sign was
# a customer.
#
# WHAT THIS RUNS: lint, formatting, the build, and every test that needs no
# database -- 400 of them today. That set is derived automatically -- see
# vitest.ci.config.js -- so a test added tomorrow lands on the correct side
# without anyone choosing, and the run's own output is the count that counts.
#
# WHAT IT DOES NOT RUN: the rest of the suite, which talks to the real Supabase
# project. Those place real orders and consume real stock, so running them on
# every push would put a hundred orders into a live shop. They are run
# deliberately before a release, and docs/OPERATIONS.md says how.
#
# NO SECRETS. Nothing here needs a credential, which means nothing here can
# leak one. The placeholder values exist only because createClient() throws on
# a missing URL at module load; no request is ever made.

name: checks

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first. Nobody needs the results
# of a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-credential

    steps:
      # v5 rather than v4 on both: the v4 pins target Node 20, which GitHub
      # has deprecated and now force-runs on Node 24, warning on every run.
      # v5 targets Node 24 properly. setup-node v5's one breaking change is
      # automatic cache detection, which does not apply here -- the cache is
      # asked for explicitly on the next line.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree, which is the whole
      # point of having a lockfile.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # Runs before the tests on purpose. A build failure is usually a typo or
      # a bad import, and finding that out in seconds beats finding it out
      # after a test run.
      - name: Build
        run: npm run build

      - name: Tests that need no database
        run: npm run test:ci
